services:
  dockly:
    build:
      context: .
      args:
        VERSION: dev
    image: dockly:local
    container_name: dockly
    restart: unless-stopped
    ports:
      - "${DOCKLY_PORT:-8080}:8080"
    environment:
      DOCKLY_LISTEN: ":8080"
      DOCKLY_DATA_DIR: /var/lib/dockly
      DOCKLY_API_TOKEN: "${DOCKLY_API_TOKEN:-}"
      DOCKLY_SECURE_COOKIES: "${DOCKLY_SECURE_COOKIES:-false}"
      DOCKLY_HEALTH_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dockly-data:/var/lib/dockly
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  dockly-data:
