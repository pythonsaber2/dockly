name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o dockly ./cmd/dockly
      - uses: actions/upload-artifact@v7
        with:
          name: dockly-linux-amd64
          path: dockly

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: dockly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
