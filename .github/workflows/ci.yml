name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Website checks
        run: |
          python3 site/scripts/check-site.py
          node --check internal/server/web/app.js
          node --check site/script.js
          node --check site/site.js
      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -o dockly ./cmd/dockly
          CGO_ENABLED=0 go build -trimpath -o dockly-site ./cmd/dockly-site
      - uses: actions/upload-artifact@v4
        with:
          name: dockly-linux-amd64
          path: |
            dockly
            dockly-site

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dockly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
